services:
  - type: web
    name: SecuraX
    runtime: python
    buildCommand: |
      pip install -r backend/requirements.txt
      cd vite-project && npm install && npm run build
      mkdir -p backend/dist
      cp -r dist/* ../backend/dist/
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "20"
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /api/health
