services:
  - type: web
    name: SecuraX
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && npm --prefix vite-project install && npm --prefix vite-project run build"
    startCommand: "cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /api/health
